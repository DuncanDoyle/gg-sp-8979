apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: demo-backend-route
  namespace: grpc-demo
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: grpc-nack-gw
      namespace: gloo-system
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        # Routing to a Gloo Upstream directly (group: gloo.solo.io) is what triggers the bug path.
        # When the Upstream has a corrupt protoDescriptorBin, Gloo still accepts the Upstream and
        # translates it into an Envoy RouteConfiguration that Envoy then NACKs.
        - group: gloo.solo.io
          kind: Upstream
          name: demo-backend
          namespace: gloo-system
          weight: 1
