apiVersion: v1
kind: Service
metadata:
  name: demo-backend
  namespace: grpc-demo
spec:
  ports:
    - name: grpc
      port: 8080
      targetPort: 8080
  selector:
    app: demo-backend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-backend
  namespace: grpc-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-backend
  template:
    metadata:
      labels:
        app: demo-backend
    spec:
      containers:
        - name: backend
          # go-httpbin is a lightweight stand-in; actual gRPC calls are not needed to trigger the bug —
          # the NACK storm is caused solely by the invalid protoDescriptorBin on the Upstream.
          image: mccutchen/go-httpbin:v2.15.0
          ports:
            - containerPort: 8080
