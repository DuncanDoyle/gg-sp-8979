gloo:
  kubeGateway:
    # Enable Kubernetes Gateway API integration — this is the mode affected by the bug
    enabled: true
  gatewayProxies:
    gatewayProxy:
      disabled: false
      gatewaySettings:
        # Don't auto-generate Edge Gateway CRs; we deploy gateways/gateway-proxy.yaml explicitly
        disableGeneratedGateways: true
      service:
        # Use port 81 to avoid conflict with the K8S Gateway API proxy on port 80
        httpPort: 81
        type: LoadBalancer
  gateway:
    validation:
      allowWarnings: false
      alwaysAcceptResources: false
      fullEnvoyValidation: true
  gloo:
    logLevel: info
    disableLeaderElection: true
    deployment:
      replicas: 1
      livenessProbeEnabled: true
      stats:
        enabled: "true"
  discovery:
    enabled: false

observability:
  enabled: false

prometheus:
  enabled: false

grafana:
  defaultInstallationEnabled: false

gloo-fed:
  enabled: false
  glooFedApiserver:
    enable: false

gateway-portal-web-server:
  enabled: false

global:
  extensions:
    rateLimit:
      enabled: false
    extAuth:
      enabled: false
